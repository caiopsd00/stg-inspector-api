name: brlift-production
x-logging: &bounded-logs
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brlift
      POSTGRES_USER: brlift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina uma senha forte}
    volumes: ["database:/var/lib/postgresql/data"]
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=128MB"]
    mem_limit: 768m
    shm_size: 128m
    logging: *bounded-logs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brlift -d brlift"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: brlift
      PGUSER: brlift
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina uma senha forte}
      WEB_ORIGIN: https://${DOMAIN:?Defina o domínio}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-false}
      TRUST_PROXY: "1"
      STORAGE_DIR: /app/storage
      STORAGE_WRITE_BACKEND: ${STORAGE_WRITE_BACKEND:-local}
      STORAGE_READ_BACKENDS: ${STORAGE_READ_BACKENDS:-local}
      GCS_BUCKET: ${GCS_BUCKET:-}
      PORT: 3333
      NODE_ENV: production
      DOCUMENT_CONCURRENCY: "1"
      MEDIA_UPLOAD_CONCURRENCY: "1"
      NODE_OPTIONS: --max-old-space-size=512
      MALLOC_ARENA_MAX: "2"
      UV_THREADPOOL_SIZE: "2"
    volumes: ["media:/app/storage"]
    init: true
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 130s
    logging: *bounded-logs
    depends_on:
      postgres: {condition: service_healthy}
    command: ["sh", "-c", "node dist/server/migrate.js && exec node dist/server/index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  web:
    build: ${WEB_REPO:-../stg-system-web}
    mem_limit: 128m
    logging: *bounded-logs
    restart: unless-stopped
  gateway:
    image: caddy:2-alpine
    mem_limit: 128m
    logging: *bounded-logs
    environment:
      DOMAIN: ${DOMAIN:?Defina o domínio}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - tls:/data
      - caddy-config:/config
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
    restart: unless-stopped
volumes:
  database:
  media:
  tls:
  caddy-config:
