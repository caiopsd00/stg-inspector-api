name: brlift-production
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brlift
      POSTGRES_USER: brlift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina uma senha forte}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brlift -d brlift"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: brlift
      PGUSER: brlift
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina uma senha forte}
      WEB_ORIGIN: https://${DOMAIN:?Defina o domínio}
      STORAGE_DIR: /app/storage
      PORT: 3333
      NODE_ENV: production
    volumes: ["media:/app/storage"]
    depends_on:
      postgres: {condition: service_healthy}
    command: ["sh", "-c", "node dist/server/migrate.js && node dist/server/index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  web:
    build: ${WEB_REPO:-../stg-system-v2}
    restart: unless-stopped
  gateway:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Defina o domínio}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - tls:/data
      - caddy-config:/config
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
    restart: unless-stopped
volumes:
  database:
  media:
  tls:
  caddy-config:
